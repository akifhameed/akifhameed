<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title description">
  <title id="title">AI and cloud engineer at a multi-monitor workstation</title>
  <description id="description">A vibrant, semi-realistic workstation scene with subtle cinematic movement and animated monitor glow.</description>

  <defs>
    <clipPath id="frame">
      <rect x="0" y="0" width="1536" height="1024" rx="34" />
    </clipPath>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#26d9ff" stop-opacity=".24" />
      <stop offset="1" stop-color="#26d9ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".18" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="amberGlow">
      <stop offset="0" stop-color="#f5b942" stop-opacity=".18" />
      <stop offset="1" stop-color="#f5b942" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset=".5" stop-color="#7dd3fc" stop-opacity=".09" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <image href="akif-ai-workspace-v2.png" x="-8" y="-5" width="1552" height="1034" preserveAspectRatio="xMidYMid slice">
      <animate attributeName="x" values="-8;-16;-8" dur="9s" repeatCount="indefinite" />
      <animate attributeName="y" values="-5;-10;-5" dur="9s" repeatCount="indefinite" />
      <animate attributeName="width" values="1552;1568;1552" dur="9s" repeatCount="indefinite" />
      <animate attributeName="height" values="1034;1045;1034" dur="9s" repeatCount="indefinite" />
    </image>

    <ellipse cx="430" cy="385" rx="360" ry="260" fill="url(#cyanGlow)">
      <animate attributeName="opacity" values=".45;.9;.45" dur="3.8s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="820" cy="335" rx="310" ry="220" fill="url(#violetGlow)">
      <animate attributeName="opacity" values=".35;.8;.35" dur="4.6s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="1270" cy="580" rx="300" ry="260" fill="url(#amberGlow)">
      <animate attributeName="opacity" values=".35;.75;.35" dur="5.2s" repeatCount="indefinite" />
    </ellipse>

    <rect x="55" y="205" width="1425" height="38" fill="url(#scan)" opacity="0">
      <animate attributeName="y" values="205;585;205" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;.8;0" dur="7s" repeatCount="indefinite" />
    </rect>

    <g fill="#8be9ff" filter="url(#softGlow)">
      <circle cx="138" cy="352" r="7">
        <animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <circle cx="914" cy="280" r="6">
        <animate attributeName="opacity" values="1;.2;1" dur="3.1s" repeatCount="indefinite" />
      </circle>
      <circle cx="1328" cy="476" r="7">
        <animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite" />
      </circle>
    </g>

    <rect x="1.5" y="1.5" width="1533" height="1021" rx="32.5" fill="none" stroke="#355274" stroke-width="3" opacity=".75" />
  </g>
</svg>
