<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="title description">
  <title id="title">Akif Hameed AI and DevOps engineer animation</title>
  <description id="description">An animated illustration of an engineer building an AI retrieval system and deploying it to the cloud.</description>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14233a"/>
      <stop offset="1" stop-color="#09111f"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30445f"/>
      <stop offset="1" stop-color="#18263a"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
    <clipPath id="leftScreenClip">
      <rect x="89" y="79" width="292" height="166" rx="8"/>
    </clipPath>
    <clipPath id="rightScreenClip">
      <rect x="619" y="79" width="292" height="166" rx="8"/>
    </clipPath>
  </defs>

  <style>
    .node { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .node.n2 { animation-delay: .4s; }
    .node.n3 { animation-delay: .8s; }
    .node.n4 { animation-delay: 1.2s; }
    .flow { stroke-dasharray: 7 10; animation: dash 2.2s linear infinite; }
    .flow.reverse { animation-direction: reverse; }
    .code-line { transform-box: fill-box; transform-origin: left center; animation: type 3s ease-in-out infinite; }
    .code-line.c2 { animation-delay: .45s; }
    .code-line.c3 { animation-delay: .9s; }
    .code-line.c4 { animation-delay: 1.35s; }
    .float { animation: float 3.4s ease-in-out infinite; }
    .float.f2 { animation-delay: .7s; }
    .float.f3 { animation-delay: 1.4s; }
    .cursor { animation: blink 1s steps(2, end) infinite; }
    .signal { animation: travel 3s ease-in-out infinite; }
    .signal.s2 { animation-delay: 1s; }
    .signal.s3 { animation-delay: 2s; }
    .spark { animation: sparkle 2.2s ease-in-out infinite; }
    .spark.s2 { animation-delay: .8s; }
    .spark.s3 { animation-delay: 1.5s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: .8; }
      50% { transform: scale(1.18); opacity: 1; }
    }
    @keyframes dash { to { stroke-dashoffset: -34; } }
    @keyframes type {
      0%, 15% { transform: scaleX(.18); opacity: .45; }
      48%, 78% { transform: scaleX(1); opacity: 1; }
      100% { transform: scaleX(.18); opacity: .45; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes travel {
      0% { transform: translateX(0); opacity: 0; }
      12% { opacity: 1; }
      88% { opacity: 1; }
      100% { transform: translateX(184px); opacity: 0; }
    }
    @keyframes sparkle {
      0%, 100% { opacity: .2; transform: scale(.75); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="1000" height="380" rx="24" fill="url(#background)"/>
  <path d="M0 318 C180 270 330 350 500 313 C690 270 810 330 1000 292 V380 H0Z" fill="#0a1526"/>
  <circle cx="82" cy="45" r="80" fill="#0ea5e9" opacity=".05"/>
  <circle cx="913" cy="330" r="120" fill="#f5b942" opacity=".045"/>

  <g fill="#f5b942" filter="url(#glow)">
    <circle class="spark" cx="62" cy="58" r="2.5"/>
    <circle class="spark s2" cx="935" cy="52" r="2.5"/>
    <circle class="spark s3" cx="744" cy="34" r="2"/>
  </g>

  <!-- Left monitor: retrieval and knowledge graph -->
  <g filter="url(#softShadow)">
    <rect x="72" y="60" width="326" height="205" rx="14" fill="#020814" stroke="#30445f" stroke-width="3"/>
    <rect x="89" y="79" width="292" height="166" rx="8" fill="url(#screen)"/>
    <path d="M215 265 V291 M171 293 H259" stroke="#53657d" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g clip-path="url(#leftScreenClip)">
    <rect x="89" y="79" width="292" height="24" fill="#111f34"/>
    <circle cx="103" cy="91" r="3" fill="#ef4444"/>
    <circle cx="114" cy="91" r="3" fill="#f5b942"/>
    <circle cx="125" cy="91" r="3" fill="#22c55e"/>
    <text x="139" y="95" fill="#8da2bf" font-family="Arial, sans-serif" font-size="9" letter-spacing="1.4">RETRIEVAL PIPELINE</text>

    <path class="flow" d="M123 163 C155 121 193 125 221 157 S282 202 341 146" fill="none" stroke="#38bdf8" stroke-width="2" opacity=".7"/>
    <path class="flow reverse" d="M124 190 C167 211 207 204 244 178 S304 117 348 183" fill="none" stroke="#f5b942" stroke-width="2" opacity=".7"/>
    <g fill="#0b1729" stroke="#f5b942" stroke-width="2" filter="url(#glow)">
      <circle class="node" cx="123" cy="163" r="10"/>
      <circle class="node n2" cx="193" cy="132" r="10"/>
      <circle class="node n3" cx="246" cy="177" r="11"/>
      <circle class="node n4" cx="341" cy="146" r="10"/>
    </g>
    <g fill="#c9d7e8" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      <text x="123" y="166">DOC</text>
      <text x="193" y="135">EMBED</text>
      <text x="246" y="180">RAG</text>
      <text x="341" y="149">LLM</text>
    </g>
    <rect class="code-line" x="112" y="222" width="102" height="5" rx="2.5" fill="#38bdf8" opacity=".8"/>
    <rect class="code-line c2" x="226" y="222" width="66" height="5" rx="2.5" fill="#64748b"/>
    <rect class="cursor" x="302" y="219" width="3" height="10" fill="#f5b942"/>
  </g>

  <!-- Right monitor: deployment pipeline -->
  <g filter="url(#softShadow)">
    <rect x="602" y="60" width="326" height="205" rx="14" fill="#020814" stroke="#30445f" stroke-width="3"/>
    <rect x="619" y="79" width="292" height="166" rx="8" fill="url(#screen)"/>
    <path d="M765 265 V291 M721 293 H809" stroke="#53657d" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g clip-path="url(#rightScreenClip)">
    <rect x="619" y="79" width="292" height="24" fill="#111f34"/>
    <circle cx="633" cy="91" r="3" fill="#ef4444"/>
    <circle cx="644" cy="91" r="3" fill="#f5b942"/>
    <circle cx="655" cy="91" r="3" fill="#22c55e"/>
    <text x="669" y="95" fill="#8da2bf" font-family="Arial, sans-serif" font-size="9" letter-spacing="1.4">MODEL TO PRODUCTION</text>

    <path class="flow" d="M659 159 H846" fill="none" stroke="#f5b942" stroke-width="3"/>
    <g class="float">
      <rect x="644" y="134" width="54" height="48" rx="10" fill="#142a43" stroke="#38bdf8" stroke-width="2"/>
      <path d="M659 166 L671 143 L684 166 Z" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <text x="671" y="176" fill="#dce8f5" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">AI</text>
    </g>
    <g class="float f2">
      <rect x="735" y="134" width="54" height="48" rx="10" fill="#142a43" stroke="#f5b942" stroke-width="2"/>
      <path d="M750 147 H774 V169 H750 Z M756 153 H768 M756 159 H768 M756 165 H764" fill="none" stroke="#f5b942" stroke-width="2"/>
      <text x="762" y="176" fill="#dce8f5" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">API</text>
    </g>
    <g class="float f3">
      <path d="M835 178 H872 C883 178 890 170 890 160 C890 150 883 142 873 142 C869 131 859 124 847 126 C837 127 830 134 827 143 C817 144 811 151 811 160 C811 170 820 178 835 178Z" fill="#142a43" stroke="#38bdf8" stroke-width="2"/>
      <text x="850" y="164" fill="#dce8f5" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">CLOUD</text>
    </g>
    <circle class="signal" cx="704" cy="159" r="5" fill="#f5b942" filter="url(#glow)"/>
    <circle class="signal s2" cx="704" cy="159" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle class="signal s3" cx="704" cy="159" r="5" fill="#22c55e" filter="url(#glow)"/>
    <rect class="code-line" x="648" y="213" width="88" height="5" rx="2.5" fill="#22c55e"/>
    <rect class="code-line c2" x="747" y="213" width="122" height="5" rx="2.5" fill="#64748b"/>
    <rect class="code-line c3" x="648" y="227" width="150" height="5" rx="2.5" fill="#38bdf8"/>
    <rect class="code-line c4" x="807" y="227" width="62" height="5" rx="2.5" fill="#f5b942"/>
  </g>

  <!-- Cartoon engineer -->
  <ellipse cx="501" cy="341" rx="118" ry="22" fill="#020713" opacity=".6"/>
  <g filter="url(#softShadow)">
    <path d="M421 330 C425 275 449 240 500 236 C551 240 575 275 579 330Z" fill="url(#hoodie)"/>
    <path d="M465 253 C480 267 520 267 535 253" fill="none" stroke="#3d526e" stroke-width="7" stroke-linecap="round"/>
    <path d="M472 213 C468 185 479 158 503 155 C530 157 540 183 534 211 C529 235 514 248 501 248 C487 248 476 235 472 213Z" fill="#c9875b"/>
    <path d="M469 192 C465 165 480 146 504 145 C531 145 544 166 537 197 C528 187 523 174 512 169 C500 179 487 184 469 192Z" fill="#111827"/>
    <path d="M481 214 C492 222 510 222 521 214" fill="none" stroke="#925c3f" stroke-width="3" stroke-linecap="round"/>
    <path d="M445 283 C421 279 395 277 368 278" fill="none" stroke="#263951" stroke-width="24" stroke-linecap="round"/>
    <path d="M555 283 C579 279 605 277 632 278" fill="none" stroke="#263951" stroke-width="24" stroke-linecap="round"/>
    <circle cx="367" cy="278" r="12" fill="#c9875b"/>
    <circle cx="633" cy="278" r="12" fill="#c9875b"/>
  </g>

  <!-- Desk and keyboard -->
  <path d="M275 292 H725 L755 316 H245Z" fill="#334155" stroke="#50627a" stroke-width="2"/>
  <path d="M245 316 H755 V329 H245Z" fill="#1b2a3e"/>
  <path d="M425 293 H575 L602 309 H398Z" fill="#0b1321" stroke="#64748b" stroke-width="2"/>
  <g stroke="#30445f" stroke-width="1">
    <path d="M419 300 H581 M432 305 H590 M452 295 L439 309 M478 295 L470 309 M504 295 V309 M530 295 L538 309 M556 295 L573 309"/>
  </g>
  <rect x="295" y="329" width="16" height="51" fill="#172437"/>
  <rect x="689" y="329" width="16" height="51" fill="#172437"/>

  <!-- Small status chips -->
  <g class="float" font-family="Arial, sans-serif" font-size="10" font-weight="700">
    <rect x="42" y="308" width="122" height="31" rx="15.5" fill="#11243a" stroke="#38bdf8"/>
    <circle cx="59" cy="323.5" r="5" fill="#22c55e"/>
    <text x="72" y="327" fill="#dce8f5">RAG READY</text>
  </g>
  <g class="float f2" font-family="Arial, sans-serif" font-size="10" font-weight="700">
    <rect x="836" y="308" width="122" height="31" rx="15.5" fill="#11243a" stroke="#f5b942"/>
    <circle cx="853" cy="323.5" r="5" fill="#22c55e"/>
    <text x="866" y="327" fill="#dce8f5">DEPLOYED</text>
  </g>
</svg>
